server {
    listen 80;
    server_name localhost;

    # Docker internal DNS resolver with 5s cache TTL
    resolver 127.0.0.11 valid=5s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy to Merchant Service (Dynamic DNS resolution)
    location /api/v1/merchants {
        set $upstream_merchant http://merchant-service:8081;
        proxy_pass $upstream_merchant;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy to Payment Service (Dynamic DNS resolution)
    location /api/v1/payments {
        set $upstream_payment http://payment-service:8082;
        proxy_pass $upstream_payment;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_header Idempotency-Key;
        proxy_pass_header X-API-Key;
        proxy_pass_header X-Cache-Lookup;
    }

    # Proxy to Ledger Service (Dynamic DNS resolution)
    location /api/v1/ledger {
        set $upstream_ledger http://ledger-service:8083;
        proxy_pass $upstream_ledger;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Microservice Health Probes
    location /health/merchant {
        set $upstream_merchant_health http://merchant-service:8081/health;
        proxy_pass $upstream_merchant_health;
    }
    location /health/payment {
        set $upstream_payment_health http://payment-service:8082/health;
        proxy_pass $upstream_payment_health;
    }
    location /health/ledger {
        set $upstream_ledger_health http://ledger-service:8083/health;
        proxy_pass $upstream_ledger_health;
    }
}

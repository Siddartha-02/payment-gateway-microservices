apiVersion: apps/v1
kind: Deployment
metadata:
  name: merchant-service
  namespace: payment-gateway
  labels:
    app: merchant-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: merchant-service
  template:
    metadata:
      labels:
        app: merchant-service
    spec:
      containers:
        - name: merchant-service
          image: payment-gateway-merchant-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: PORT
              value: "8081"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: merchant-service
  namespace: payment-gateway
spec:
  selector:
    app: merchant-service
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081

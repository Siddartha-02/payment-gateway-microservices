apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: payment-gateway
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: payment-gateway-payment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: PORT
              value: "8082"
            - name: MERCHANT_SERVICE_URL
              value: "http://merchant-service.payment-gateway.svc.cluster.local:8081"
            - name: LEDGER_SERVICE_URL
              value: "http://ledger-service.payment-gateway.svc.cluster.local:8083"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: payment-gateway
spec:
  selector:
    app: payment-service
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082

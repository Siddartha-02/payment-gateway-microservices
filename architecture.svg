<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#818cf8"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowSky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-weight: 700; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 13px; fill: #94a3b8; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #f8fafc; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 11px; fill: #94a3b8; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 10px; font-weight: 600; }
    .k8s-head { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #38bdf8; letter-spacing: 1px; }
  </style>

  <!-- Canvas Background -->
  <rect width="1000" height="580" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="40" y="46" class="title" font-size="22">⚡ ApexPay - Microservices Architecture &amp; Request Flow</text>
  <text x="40" y="70" class="subtitle">Kubernetes (Kind) Cluster Topology • SSL/HTTPS Ingress • Double-Entry Ledger</text>

  <!-- 1. Client / Customer -->
  <g transform="translate(35, 230)" filter="url(#shadow)">
    <rect width="130" height="115" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="65" y="40" text-anchor="middle" font-size="28">🌐</text>
    <text x="65" y="68" class="card-title" text-anchor="middle">Customer</text>
    <text x="65" y="86" class="card-desc" text-anchor="middle">Browser / Merchant</text>
    <rect x="25" y="94" width="80" height="16" rx="8" fill="#1e1b4b"/>
    <text x="65" y="106" class="badge-txt" fill="#a5b4fc" text-anchor="middle">HTTPS / Browser</text>
  </g>

  <!-- Arrow: Client -> HAProxy -->
  <path d="M 165 287 L 225 287" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowSlate)"/>
  <text x="195" y="278" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">:443</text>

  <!-- 2. HAProxy (SSL Termination on Host) -->
  <g transform="translate(230, 215)" filter="url(#shadow)">
    <rect width="140" height="145" rx="12" fill="url(#cardGrad)" stroke="#4338ca" stroke-width="1.5"/>
    <text x="70" y="38" text-anchor="middle" font-size="26">🔒</text>
    <text x="70" y="66" class="card-title" text-anchor="middle">HAProxy</text>
    <text x="70" y="85" class="card-desc" text-anchor="middle">SSL Termination</text>
    <text x="70" y="102" class="badge-txt" fill="#c7d2fe" text-anchor="middle">siddhu.ddns.net</text>
    <rect x="25" y="115" width="90" height="18" rx="9" fill="#1e1b4b" stroke="#4338ca"/>
    <text x="70" y="128" class="badge-txt" fill="#a5b4fc" text-anchor="middle">Port 443 (Host)</text>
  </g>

  <!-- Arrow: HAProxy -> Ingress Nginx -->
  <path d="M 370 287 L 430 287" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#arrowIndigo)"/>

  <!-- 3. Kubernetes Cluster Boundary Box -->
  <rect x="435" y="95" width="530" height="455" rx="16" fill="#081024" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6,4" fill-opacity="0.6"/>
  <text x="455" y="122" class="k8s-head">☸ KUBERNETES CLUSTER (KIND) • NAMESPACE: PAYMENT-GATEWAY</text>

  <!-- 4. Ingress Nginx Controller inside K8s -->
  <g transform="translate(455, 215)" filter="url(#shadow)">
    <rect width="125" height="145" rx="12" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="1.5"/>
    <text x="62" y="38" text-anchor="middle" font-size="26">🚦</text>
    <text x="62" y="66" class="card-title" text-anchor="middle">Ingress Nginx</text>
    <text x="62" y="85" class="card-desc" text-anchor="middle">Path Router</text>
    <text x="62" y="102" class="badge-txt" fill="#38bdf8" text-anchor="middle">Cluster Gateway</text>
    <rect x="20" y="115" width="85" height="18" rx="9" fill="#082f49" stroke="#0284c7"/>
    <text x="62" y="128" class="badge-txt" fill="#7dd3fc" text-anchor="middle">NodePort 32474</text>
  </g>

  <!-- Routing Paths from Ingress to 4 Pods -->
  <!-- Path 1: /pay -> Dashboard -->
  <path d="M 580 250 Q 625 250, 625 175 T 670 175" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowSky)"/>
  <rect x="590" y="152" width="50" height="16" rx="4" fill="#082f49"/>
  <text x="615" y="164" font-family="monospace" font-size="9" fill="#38bdf8" text-anchor="middle">/pay</text>

  <!-- Path 2: /api/v1/payments -> Payment Service -->
  <path d="M 580 287 L 670 287" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowEmerald)"/>
  <rect x="586" y="278" width="82" height="16" rx="4" fill="#064e3b"/>
  <text x="627" y="290" font-family="monospace" font-size="8.5" fill="#34d399" text-anchor="middle">/api/v1/payments</text>

  <!-- Path 3: /api/v1/merchants -> Merchant Service -->
  <path d="M 580 325 Q 625 325, 625 395 T 670 395" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#arrowIndigo)"/>
  <rect x="585" y="386" width="84" height="16" rx="4" fill="#1e1b4b"/>
  <text x="627" y="398" font-family="monospace" font-size="8.5" fill="#a5b4fc" text-anchor="middle">/api/v1/merchants</text>

  <!-- Path 4: /api/v1/ledger -> Ledger Service -->
  <path d="M 580 340 Q 615 340, 615 480 T 670 480" fill="none" stroke="#14b8a6" stroke-width="1.8" marker-end="url(#arrowSlate)"/>
  <rect x="592" y="471" width="75" height="16" rx="4" fill="#042f2e"/>
  <text x="629" y="483" font-family="monospace" font-size="8.5" fill="#2dd4bf" text-anchor="middle">/api/v1/ledger</text>

  <!-- 5. Kubernetes Pod Cards -->

  <!-- Pod A: Dashboard UI -->
  <g transform="translate(675, 135)" filter="url(#shadow)">
    <rect width="265" height="85" rx="10" fill="url(#cardGrad)" stroke="#0369a1" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="85" rx="2" fill="#38bdf8"/>
    <text x="18" y="26" class="card-title">🎨 dashboard-ui</text>
    <text x="18" y="44" class="card-desc">Fintech Portal, Terminal &amp; Metrics</text>
    <rect x="18" y="56" width="65" height="18" rx="4" fill="#082f49"/>
    <text x="50" y="69" class="badge-txt" fill="#38bdf8" text-anchor="middle">Port 80</text>
    <rect x="90" y="56" width="75" height="18" rx="4" fill="#0f172a"/>
    <text x="127" y="69" class="badge-txt" fill="#94a3b8" text-anchor="middle">Nginx / HTML</text>
  </g>

  <!-- Pod B: Payment Service -->
  <g transform="translate(675, 235)" filter="url(#shadow)">
    <rect width="265" height="95" rx="10" fill="url(#cardGrad)" stroke="#059669" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="95" rx="2" fill="#10b981"/>
    <text x="18" y="26" class="card-title">💳 payment-service</text>
    <text x="18" y="44" class="card-desc">Idempotency &amp; State Machine</text>
    <text x="18" y="58" class="card-desc">State: INITIATED &#8594; CAPTURED</text>
    <rect x="18" y="68" width="75" height="18" rx="4" fill="#064e3b"/>
    <text x="55" y="81" class="badge-txt" fill="#34d399" text-anchor="middle">Port 8082</text>
    <rect x="100" y="68" width="60" height="18" rx="4" fill="#0f172a"/>
    <text x="130" y="81" class="badge-txt" fill="#94a3b8" text-anchor="middle">Go 1.22</text>
  </g>

  <!-- Pod C: Merchant Service -->
  <g transform="translate(675, 345)" filter="url(#shadow)">
    <rect width="265" height="85" rx="10" fill="url(#cardGrad)" stroke="#4338ca" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="85" rx="2" fill="#6366f1"/>
    <text x="18" y="26" class="card-title">🔑 merchant-service</text>
    <text x="18" y="44" class="card-desc">API Keys (sk_live_...) &amp; Merchant Auth</text>
    <rect x="18" y="56" width="75" height="18" rx="4" fill="#1e1b4b"/>
    <text x="55" y="69" class="badge-txt" fill="#a5b4fc" text-anchor="middle">Port 8081</text>
    <rect x="100" y="56" width="60" height="18" rx="4" fill="#0f172a"/>
    <text x="130" y="69" class="badge-txt" fill="#94a3b8" text-anchor="middle">Go 1.22</text>
  </g>

  <!-- Pod D: Ledger Service -->
  <g transform="translate(675, 445)" filter="url(#shadow)">
    <rect width="265" height="85" rx="10" fill="url(#cardGrad)" stroke="#0d9488" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="85" rx="2" fill="#14b8a6"/>
    <text x="18" y="26" class="card-title">⚖️ ledger-service</text>
    <text x="18" y="44" class="card-desc">Double-Entry &amp; SHA-256 Audit Chain</text>
    <rect x="18" y="56" width="75" height="18" rx="4" fill="#042f2e"/>
    <text x="55" y="69" class="badge-txt" fill="#2dd4bf" text-anchor="middle">Port 8083</text>
    <rect x="100" y="56" width="60" height="18" rx="4" fill="#0f172a"/>
    <text x="130" y="69" class="badge-txt" fill="#94a3b8" text-anchor="middle">Go 1.22</text>
  </g>

  <!-- Internal Cross-Pod Calls -->
  <!-- Payment -> Ledger (Async Event) -->
  <path d="M 910 330 Q 945 385, 910 445" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowSlate)"/>
  <text x="955" y="392" font-family="monospace" font-size="8.5" fill="#2dd4bf" text-anchor="middle">Journal Event</text>

  <!-- Payment -> Merchant (Verify Key) -->
  <path d="M 780 330 L 780 345" fill="none" stroke="#a5b4fc" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowIndigo)"/>
</svg>
